services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: igaming-backend
    ports:
      - "8001:8000"
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: sqlite:///./data.db
      FRONTEND_ORIGIN: http://localhost:3000
    volumes:
      - ./backend/data.db:/app/data.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: igaming-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
