name: Frontend CI

on:
  push:
    branches: ["main"]
    paths:
      - "igaming-research-agent/frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "igaming-research-agent/frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: igaming-research-agent/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: igaming-research-agent/frontend/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run tests
        run: npm test -- --run
