name: Backend CI

on:
  push:
    branches: ["main"]
    paths:
      - "igaming-research-agent/backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "igaming-research-agent/backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: igaming-research-agent/backend

    env:
      DATABASE_URL: sqlite:///./data.db
      OPENAI_API_KEY: test-key
      SERPER_API_KEY: test-key
      ANTHROPIC_API_KEY: test-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: igaming-research-agent/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        run: pytest -v tests/
